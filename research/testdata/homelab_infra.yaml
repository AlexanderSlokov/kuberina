# 3 ThinkCentre M720q homelab nodes running k3s
# CPU: 4 cores, RAM: 16 GiB each, no GPU
# Resource values: CPU in cores, RAM in GiB, GPU in units

nodes:
  - name: thinkcentre-alpha
    allocatable:
      cpu: 4.0
      ram: 16.0
      gpu: 0.0
    labels:
      node-role: worker
    taints: []
    zone: home

  - name: thinkcentre-beta
    allocatable:
      cpu: 4.0
      ram: 16.0
      gpu: 0.0
    labels:
      node-role: worker
      usb-dongle: "true"     # Zigbee USB stick plugged into this node
    taints: []
    zone: home

  - name: thinkcentre-gamma
    allocatable:
      cpu: 4.0
      ram: 16.0
      gpu: 0.0
    labels:
      node-role: worker
    taints: []
    zone: home

# Ship's own systems — pre-deducted from capacity (Phase 0)
daemonsets:
  - name: kube-proxy
    resources:
      cpu: 0.1
      ram: 0.064
      gpu: 0.0
    nodeSelector: {}
    tolerations: []

  - name: calico-node
    resources:
      cpu: 0.25
      ram: 0.128
      gpu: 0.0
    nodeSelector: {}
    tolerations: []

  - name: node-exporter
    resources:
      cpu: 0.1
      ram: 0.064
      gpu: 0.0
    nodeSelector: {}
    tolerations: []
