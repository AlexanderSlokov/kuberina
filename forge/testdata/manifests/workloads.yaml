apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
  namespace: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trainer
  template:
    metadata:
      labels:
        app: trainer
        tier: compute
    spec:
      nodeSelector:
        accelerator: h100
      tolerations:
        - key: dedicated
          operator: Equal
          value: ml
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
      containers:
        - name: trainer
          image: ghcr.io/example/trainer:1.4.2
          ports:
            - containerPort: 8080
          env:
            - name: EPOCHS
              value: "40"
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
        - name: log-shipper
          image: ghcr.io/example/fluent:2.1
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parameter-server
  namespace: ai
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: parameter-server
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: trainer
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ps
          image: ghcr.io/example/ps:1.4.2
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  template:
    spec:
      tolerations:
        - key: dedicated
          operator: Exists
      containers:
        - name: exporter
          image: prom/node-exporter:v1.8.2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trainer
  namespace: ai
spec:
  selector:
    app: trainer
  ports:
    - port: 8080
